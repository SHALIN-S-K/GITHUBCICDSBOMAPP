name: SBOM Generation and Upload

on:
  push: 
    branches: 
      - '*'
    tags:
      - '*'
  workflow_dispatch: 

env:
  TARGET_PATH: "."
  OUTPUT_FOLDER: ${{ github.event.repository.name }}
  SBOMAPP_API_URL: ${{ secrets.SBOMAPP_API_URL || 'https://636a1a4ac34b.ngrok-free.app/api/sbom/ingest' }}

jobs:
  sbom_generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    outputs:
      version_folder: ${{ steps.set-version.outputs.version_folder }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run:  |
          sudo apt-get update && sudo apt-get install -y curl unzip jq git
          npm install -g @cyclonedx/cdxgen
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype version

      - name: Set version folder
        id: set-version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          DATE_PART=$(date +%Y-%m-%d)
          TIME_PART=$(date +%H-%M-%S)
          VERSION_FOLDER="v${SHORT_SHA}_${DATE_PART}_${TIME_PART}"
          echo "version_folder=$VERSION_FOLDER" >> $GITHUB_OUTPUT
          echo "VERSION_FOLDER=$VERSION_FOLDER" >> $GITHUB_ENV

      - name: Generate SBOM
        run: |
          set -e
          echo "🔧 Generating SBOM for $OUTPUT_FOLDER version $VERSION_FOLDER"
          
          FINAL_OUTPUT_PATH="${OUTPUT_FOLDER}/${VERSION_FOLDER}"
          mkdir -p "$FINAL_OUTPUT_PATH"
          
          SBOM_FILE="$FINAL_OUTPUT_PATH/sbom.json"
          VULNS_FILE="$FINAL_OUTPUT_PATH/vulns.json"
          ENRICHED_SBOM="$FINAL_OUTPUT_PATH/sbom-with-vulns.json"

          echo "📦 Running cdxgen..."
          cdxgen "$TARGET_PATH" -o "$SBOM_FILE" --spec-version 1.6

          echo "🛡️ Running Grype vulnerability scan..."
          grype sbom:"$SBOM_FILE" -o json > "$VULNS_FILE"

          echo "🧩 Merging SBOM with vulnerability data..."
          jq -s '(.[1] | del(.descriptor)) as $vulns | .[0] + {"VulnerabilityReport": $vulns}' \
            "$SBOM_FILE" "$VULNS_FILE" > "$ENRICHED_SBOM"
          
          echo "✅ SBOM generation complete"
          ls -la "$FINAL_OUTPUT_PATH/"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name:  sbom-files
          path: ${{ env.OUTPUT_FOLDER }}/${{ env.VERSION_FOLDER }}/
          retention-days: 7

  upload_sbom:
    name: Upload SBOM
    runs-on: ubuntu-latest
    needs: sbom_generation
    steps:
      - name: Download SBOM artifacts
        uses:  actions/download-artifact@v8
        with:
          name:  sbom-files
          path:  ./sbom-files

      - name:  Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y curl jq

      - name: Upload SBOM to API
        env:
          SBOMAPP_API_KEY: ${{ secrets.SBOMAPP_API_KEY }}
          VERSION_FOLDER: ${{ needs.sbom_generation.outputs.version_folder }}
        run: |
          set -e
          
          SBOM_FILE="./sbom-files/sbom.json"
          VULNS_FILE="./sbom-files/vulns.json"
          ENRICHED_SBOM="./sbom-files/sbom-with-vulns.json"

          echo "📤 Uploading SBOM to $SBOMAPP_API_URL"
          echo "📁 Version:  $VERSION_FOLDER"

          if [ -z "$SBOMAPP_API_KEY" ]; then
            echo "❌ Error: SBOMAPP_API_KEY secret is not set."
            exit 1
          fi
          
          if [ !  -f "$ENRICHED_SBOM" ]; then
            echo "❌ Error:  SBOM file not found at $ENRICHED_SBOM"
            exit 1
          fi
          
          echo "📄 SBOM file size: $(wc -c < "$ENRICHED_SBOM") bytes"
          
          echo "📊 Preparing upload_payload.json..."
          jq -n \
            --arg folder "$OUTPUT_FOLDER" \
            --arg version "$VERSION_FOLDER" \
            --arg commit "${{ github.sha }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg project "${{ github.event.repository.name }}" \
            --arg projectUrl "${{ github.event.repository.html_url }}" \
            --slurpfile sbomWithVulns "$ENRICHED_SBOM" \
            --slurpfile sbomBase "$SBOM_FILE" \
            --slurpfile vulns "$VULNS_FILE" \
            '{
              folder: $folder,
              version:  $version,
              metadata: {
                commit: $commit,
                branch: $branch,
                runId: $run_id,
                project: $project,
                projectUrl: $projectUrl,
                source: "github-actions",
                uploadedAt: now | todate
              },
              files: [
                { filename: "sbom-with-vulns.json", content: $sbomWithVulns[0] },
                { filename: "sbom.json", content: $sbomBase[0] },
                { filename: "vulns.json", content: $vulns[0] }
              ]
            }' > upload_payload.json
          
          echo "🚀 Uploading..."
          RESPONSE=$(curl -sSL -w "\n%{http_code}" \
            -X POST "$SBOMAPP_API_URL" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $SBOMAPP_API_KEY" \
            --data-binary @upload_payload.json \
            --max-time 120)
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "📡 Response code: $HTTP_CODE"
          echo "📋 Response body: $BODY"
          
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✅ SBOM uploaded successfully!"
          else
            echo "❌ Failed to upload SBOM (HTTP $HTTP_CODE)"
            exit 1
          fi
